<section class="login-page">
  <div class="login-panel">
    <div class="login-heading">
      <p>CareerTrack</p>
      <h1>{{ title }}</h1>
    </div>

    <div class="mode-tabs" role="tablist" aria-label="Authentication mode">
      <button type="button" [class.active]="!isSignup" (click)="switchMode('login')">
        Login
      </button>
      <button type="button" [class.active]="isSignup" (click)="switchMode('signup')">
        Sign up
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      @if (isSignup) {
        <label>
          Name
          <input type="text" formControlName="name" autocomplete="name" />
        </label>
      }

      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      <div
        class="strength"
        [class.weak]="passwordStrength.className === 'weak'"
        [class.medium]="passwordStrength.className === 'medium'"
        [class.strong]="passwordStrength.className === 'strong'"
      >
        <div class="strength-track">
          <span></span>
        </div>
        <p>{{ passwordStrength.label }}</p>
      </div>

      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="isSubmitting">
        {{ submitLabel }}
      </button>
    </form>
  </div>
</section>
